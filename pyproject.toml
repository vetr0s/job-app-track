[project]
name = "job-app-track"
version = "0.1.0"
description = "Local SQLite tracker for SWE job applications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
jat = "job_app_track.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_app_track"]
artifacts = ["src/job_app_track/migrations/*.sql"]

[tool.uv]
package = true
