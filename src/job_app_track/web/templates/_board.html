{# htmx swap target: the whole board. The per-card status <select> posts to
   /applications/<id>/status with view=board, and the handler re-renders this
   fragment into #board with a morph swap. #}
{% import "_macros.html" as m %}
<div id="board" class="board">
{% if total == 0 %}
  <p class="empty">No applications yet.</p>
{% else %}
  {% for status, apps in columns %}
  <section class="column">
    <h2>{{ status }} <span class="count">{{ apps | length }}</span></h2>
    {% for app in apps %}
    <article class="card">
      <a href="/applications/{{ app.id }}">{{ app.company }} &middot; {{ app.title }}</a>
      {% if app.interest %}<span class="interest">{{ app.interest }}</span>{% endif %}
      <form class="inline">
        <input type="hidden" name="view" value="board">
        <select name="status" aria-label="status"
                hx-post="/applications/{{ app.id }}/status"
                hx-include="closest form"
                hx-target="#board" hx-swap="morph">
          {{ m.options(enums.STATUSES, app.status) }}
        </select>
      </form>
    </article>
    {% endfor %}
  </section>
  {% endfor %}
{% endif %}
</div>
