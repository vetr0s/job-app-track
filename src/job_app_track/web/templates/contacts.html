{% extends "base.html" %}
{% block title %}Contacts{% endblock %}
{% block content %}
<h1>Contacts</h1>

<form class="filters" hx-get="/contacts" hx-target="#contacts" hx-swap="morph"
      hx-trigger="submit, change delay:200ms">
  <label>company
    <input type="text" name="company" value="{{ company }}">
  </label>
  <button type="submit">Filter</button>
</form>

<details class="add">
  <summary>Add a contact</summary>
  <form hx-post="/contacts" hx-target="#contacts" hx-swap="morph">
    <label>name <input type="text" name="name" required></label>
    <label>company <input type="text" name="company"></label>
    <label>title <input type="text" name="title"></label>
    <label>email <input type="text" name="email"></label>
    <label>phone <input type="text" name="phone"></label>
    <label>linkedin <input type="text" name="linkedin"></label>
    <label>notes <input type="text" name="notes"></label>
    <button type="submit">Add</button>
  </form>
</details>

{% include "_contacts.html" %}
{% endblock %}
