<div id="companies">
<table>
  <thead><tr><th>id</th><th>name</th><th>website</th><th>notes</th></tr></thead>
  <tbody>
  {% for company in companies %}
    <tr>
      <td>{{ company.id }}</td>
      <td>{{ company.name }}</td>
      <td>{% if company.website %}<a href="{{ company.website }}">{{ company.website }}</a>{% endif %}</td>
      <td>{{ company.notes or "" }}</td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="empty">No companies.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
